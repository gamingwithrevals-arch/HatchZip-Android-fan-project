name: Build HatchZip Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Clone Full Original HatchZip Repository Structure
        run: |
          git clone https://github.com/xevrion/hatchzip.git temp-hatchzip
          rm -rf crates
          cp -r temp-hatchzip/crates .
          if [ -f temp-hatchzip/Cargo.toml ]; then
            cp temp-hatchzip/Cargo.toml .
          fi
          rm -rf temp-hatchzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35 ndk;27.3.13750724'

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk

      - name: Ensure Android Target is Installed
        run: |
          rustup target add aarch64-linux-android

      - name: Compile HatchZip Rust Engine for S25 Ultra (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          cd android/rust-jni
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleRelease --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: HatchZip-iOS-Edition-APK
          path: android/app/build/outputs/apk/release/app-release.apk
