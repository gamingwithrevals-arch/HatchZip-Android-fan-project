name: Build HatchZip Android APK with Rust

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"

      - name: Configure Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK not found: $NDK"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Check source ZIPs
        run: |
          test -f "$GITHUB_WORKSPACE/HatchZip-Android-Starter.zip"
          test -f "$GITHUB_WORKSPACE/hatchzip-0.1.6.zip"

      - name: Extract source ZIPs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/extracted_app"
          mkdir -p "$GITHUB_WORKSPACE/extracted_rust"

          unzip -o "$GITHUB_WORKSPACE/HatchZip-Android-Starter.zip" \
            -d "$GITHUB_WORKSPACE/extracted_app"

          unzip -o "$GITHUB_WORKSPACE/hatchzip-0.1.6.zip" \
            -d "$GITHUB_WORKSPACE/extracted_rust"

      - name: Find Android project
        run: |
          SETTINGS="$(find "$GITHUB_WORKSPACE/extracted_app" \
            -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Find Rust core manifest
        run: |
          BASE="$GITHUB_WORKSPACE/extracted_rust"

          echo "Available Cargo manifests:"
          find "$BASE" -type f -name Cargo.toml -print

          MANIFEST="$(find "$BASE" -type f \
            -path '*/crates/core/Cargo.toml' -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: Expected crates/core/Cargo.toml was not found."
            echo "Check the source ZIP structure shown above."
            exit 1
          fi

          MANIFEST="$(realpath "$MANIFEST")"
          ROOT="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"

          echo "RUST_MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "RUST_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Absolute Rust root: $ROOT"
          echo "Absolute Rust manifest: $MANIFEST"

      - name: Inspect Rust crate
        run: |
          echo "Manifest: $RUST_MANIFEST"
          echo "Root: $RUST_ROOT"

          test -f "$RUST_MANIFEST"
          cat "$RUST_MANIFEST"

      - name: Build Rust core for Android ARM64
        run: |
          test -f "$RUST_MANIFEST"
          cd "$RUST_ROOT"

          cargo ndk \
            -t arm64-v8a \
            --platform 28 \
            build \
            --release \
            --manifest-path "$RUST_MANIFEST"

      - name: Locate and copy Rust shared library
        run: |
          echo "Searching for compiled shared libraries..."

          find "$RUST_ROOT/target" -type f -name '*.so' -print || true

          LIBRARY="$(find "$RUST_ROOT/target" -type f \
            -name 'libhatchzip_core.so' -print -quit)"

          if [ -z "$LIBRARY" ]; then
            echo "ERROR: libhatchzip_core.so was not generated."
            echo "The crate may use a different library name or may not be configured as a cdylib."
            exit 1
          fi

          DEST="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp "$LIBRARY" "$DEST/"

          echo "Copied library:"
          ls -lh "$DEST"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build Android APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HatchZip-Android-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
