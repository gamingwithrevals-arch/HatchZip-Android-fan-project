name: Build HatchZip Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Install NDK & cargo-ndk
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;26.3.11579264"
          cargo install cargo-ndk

      - name: Ensure Android Target is Installed on Active Toolchain
        run: |
          rustup target add aarch64-linux-android

      - name: Compile HatchZip Rust Engine for S25 Ultra (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          cd android/rust-jni
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleRelease --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: HatchZip-iOS-Edition-APK
          path: android/app/build/outputs/apk/release/app-release.apk
